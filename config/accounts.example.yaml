# Your accounts, their needs, and who is already installed.
#
#   cp config/accounts.example.yaml config/accounts.local.yaml
#
# accounts.local.yaml is gitignored: it holds account intelligence, which is a
# different sensitivity class from the public feed URLs in watchlist.yaml.
#
# This file models INSTALL BASE -- what is deployed and since when. It is
# deliberately not a CRM: no opportunities, stages, amounts, close dates or
# forecast. That line is in the design spec and is not to be crossed by drift.
#
# Incumbency is the primary axis of every answer. "What is Dell doing best for
# my accounts" resolves per segment into one of four modes:
#
#   the vendor is incumbent  -> defend / expand   (roadmap, lifecycle, attach;
#                                                  function gaps are tolerable)
#   a rival is incumbent     -> displace          (needs a disqualifying
#                                                  weakness or a trigger event)
#   declared empty: []       -> greenfield        (function and price decide)
#   segment omitted          -> unknown           (find out who is installed
#                                                  before choosing a mode)
#
# A blank incumbent is better than a guessed one: guessing wrong flips the
# answer from defend to displace while sounding equally confident. Omitting a
# segment says "not known"; only an explicit [] says "nobody is installed".

accounts:
  roche:
    name: Roche
    # Names the watchlist may report under; used to attach collected evidence.
    aliases: [Genentech, Chugai, Roche Diagnostics]

    # From the closed needs vocabulary:
    #   gxp-compliance   rnd-compute        ai-factory      cyber-resilience
    #   data-sovereignty manufacturing-ot   cost-optimisation  sustainability
    needs: [rnd-compute, gxp-compliance, cyber-resilience, data-sovereignty]

    # Who is installed, per segment. Segments are the closed set of eleven:
    #   compute-ai       compute-standard
    #   storage-block    storage-file      storage-object
    #   data-platform    data-protection   hci               networking
    #   client           services
    #
    # Values are LISTS: a mixed estate is normal, and several vendors can hold
    # the same segment at different sites or business units. Omit a segment you
    # do not know rather than guessing (it reads as unknown); write [] only when
    # you know nobody is installed (it reads as greenfield).
    incumbents:
      storage-file: [netapp]
      storage-block: [dell, hpe]
      data-protection: [dell]
      compute-standard: [hpe]
      # compute-ai: unknown -- omitted rather than guessed

    # Install-base events that open a segment held by a rival: end of support,
    # refresh due, a renewal date. Facts, not a pipeline -- no stages, amounts or
    # close dates. Only on segments with declared incumbents. Without one, the
    # incumbent keeps the segment in the ranking; with one, position decides.
    triggers:
      storage-block: "PowerMax arrays reach end of support 2027-03"

    # Free text. Anything a brief cannot know: site names, live programmes,
    # political constraints, who the decision makers are.
    notes: >
      Basel and Kaiseraugst plus Genentech in South San Francisco. Cryo-EM
      estate growing. NetApp entrenched in file since the ONTAP consolidation.

  novartis:
    name: Novartis
    aliases: [Sandoz]
    needs: [manufacturing-ot, gxp-compliance, cost-optimisation]
    incumbents:
      storage-block: [dell]
      compute-ai: []   # known: no AI compute installed yet
    notes: >
      Stein and Basel. Heavier OT/MES footprint than Roche.
