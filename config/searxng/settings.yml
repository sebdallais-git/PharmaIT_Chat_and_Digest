# SearXNG settings for the local instance on :8888, mounted read-only into the
# container by scripts/setup-searxng.sh. Only the differences from SearXNG's own
# defaults live here; the secret key comes from SEARXNG_SECRET, never this file.
use_default_settings: true

search:
  # The chat's web search and the n8n gap workflow both request format=json
  formats:
    - html
    - json

# The default general-web engines (Google, DuckDuckGo, Startpage, Brave) all
# answered this machine with CAPTCHAs, "access denied" or rate limits on
# 2026-09-26, and every gap-fill search came back empty. These engines are off
# by default but tolerate self-hosted instances better; the defaults stay on.
engines:
  - name: bing
    disabled: false
  - name: mojeek
    disabled: false
  - name: qwant
    disabled: false
  - name: yahoo
    disabled: false
  - name: presearch
    disabled: false
  # Every engine above that scrapes a public search page refused this machine
  # too (CAPTCHAs, access denied, suspensions). Brave's Search API
  # authenticates with a key instead of rate-limiting by address. The key never
  # goes in this file: scripts/setup-searxng.sh renders data/run/brave-api-key
  # into the container's copy, replacing the two marked lines below.
  - name: braveapi
    api_key: ""  # placeholder: brave-api-key
    inactive: true  # placeholder: brave-api-inactive
