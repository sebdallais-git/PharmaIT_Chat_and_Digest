# Watchlist configuration: who is watched (customers, their peer sets, IT vendors)
# and what topics are tracked with no named entity.
#
# customers.*.feeds, peers.*.feeds and each vendor's feeds were verified with
# scripts/watchlist.ts verify-feeds on 2026-09-20 (feed research: Task 3, second
# half). A missing rss/edgar/ir_page key means it was looked for and not found
# (or found but could not be verified) -- the comment beside the gap says what
# was tried. R9: feeds were (re-)checked against
# src/services/watchlist-sources.ts's DEFAULT_USER_AGENT, a plain, honest UA;
# a handful of vendor feeds that 403'd under the old default UA passed once
# that changed (noted where it happened).
#
# "peers" attaches researched feeds to a peer id that a customer's peer list
# already references (see watchlist-config.ts) -- a peer has no section of
# its own the way customers/vendors do; any peer id not listed here is still
# auto-created with no feeds, as before.
#
# topics.* keys are watchlist domains (see DOMAINS in src/services/watchlist-config.ts)
# except the literal "none" key: those are the pharma business/science/pipeline and
# supply-chain-geopolitics strings from the old SEARCH_TOPICS list that fit no domain
# in the closed set. No topic string from SEARCH_TOPICS was dropped in this move; every
# one lives under topics.cyber, topics.storage, topics.ai, topics.cloud, topics.data,
# topics.infrastructure, topics.sap or topics.none.

customers:
  roche:
    name: Roche
    aliases:
      - Genentech
      - Roche Diagnostics
      - Chugai
    feeds:
      # med_news_xml.xml is Roche's MEDICAL feed: of 10 entries it carried on
      # 2026-09-21, 6 were drug approvals and trial results (Ocrevus, Susvimo,
      # Vabysmo, Enspryng...). Useful to a pharma analyst, useless to an IT
      # account team -- you cannot open a CIO conversation with an Ocrevus
      # approval. Kept, because the occasional corporate item does come through
      # it (the Boston Innovation Center opening did).
      #
      # `when:30d` is load-bearing: Google News RSS ranks by RELEVANCE, not
      # date, so without it the feed is a mix spanning years -- the first
      # tightened Novartis query had its newest item in 2015. A never-seen feed
      # gets a 30-day backfill (FIRST_RUN_BACKFILL_MS), so every one of those
      # items fell outside the window and nothing was ingested at all.
      #
      # The second feed is the IT-scoped one. Roche publishes no corporate RSS
      # (probed rss, news_xml, corp_news_xml, media/releases.xml and the media
      # pages' autodiscovery on 2026-09-22 -- all 404 or JS-rendered), so this
      # uses the Google News search feed that web-search.ts already relies on.
      # Attached to the entity rather than to topics.*, because entity feeds run
      # in the customers pass before the ingest cap bites, and all 188 topic
      # queries currently yield nothing for exactly that reason.
      rss:
        - "https://www.roche.com/med_news_xml.xml"
        - "https://news.google.com/rss/search?q=Roche+(%22digital+transformation%22+OR+%22artificial+intelligence%22+OR+CIO+OR+%22data+center%22+OR+%22cloud+migration%22+OR+SAP+OR+%22IT+infrastructure%22)+when:30d&hl=en-US&gl=US&ceid=US:en"
      ir_page: "https://www.roche.com/investors/reports"
    # no edgar: Roche does not file with the SEC (absent from SEC company_tickers.json)
    verifiedAt: "2026-09-20"
    peers:
      - novartis
      - pfizer
      - astrazeneca
      - msd
      - jnj
      - abbvie
      - sanofi
      - gsk
      - lilly
      - bms
      - amgen
      - takeda
      - novo-nordisk
      - gilead
      - bayer
    theater: EMEA
    size: { rank: 2, year: 2025, basis: FY2024 healthcare revenue }
  novartis:
    name: Novartis
    feeds:
      # news-rss.xml is clinical, exactly like Roche's: of what it carried on
      # 2026-09-22, every item was a trial result or regulatory opinion
