# System One decision service. See
# docs/superpowers/specs/2026-09-22-system-one-decision-design.md
#
# thresholds.resolved   : noul at or above this closes the gap
# thresholds.unresolved : noul below this reopens it and spends a retry
# Between the two the gap is parked for review and spends no retry, because
# the middle of a 4B's distribution is the part least worth acting on.
# The scorer's address is endpoints.scorer in config/host.yaml (8010: Splash owns 8000).
model: jev-latest
timeout_ms: 15000
thresholds:
  resolved: 0.85
  unresolved: 0.5

# Run the scorer alongside the 27B at gap-detection time, recording both
# verdicts without letting the scorer decide anything. Detection runs on every
# chat turn -- far more traffic than gap resolution -- so this is how evidence
# accrues about whether a 4B can be trusted there, before anything depends on
# it. It costs one scorer call per turn (~0.3 s once warm) and changes nothing
# the user sees. On since 2026-09-27, when open-jev was installed on :8010;
# read the agreement with: npx tsx scripts/shadow-report.ts
shadow_detection: true

# Gap workflow page pre-check (src/services/page-relevance.ts): before the 27B
# extracts facts from a fetched page, the scorer is asked whether the page is
# about the gap's topic, and a page below this probability is answered
# NOT_RELEVANT without a 27B call. Measured with scripts/replay-page-relevance.ts
# on 2026-09-27 over 34 pages from real gap runs: at 0.1 it skips 9 of the 26
# pages the 27B discarded and none of the 8 it kept (lowest kept: 0.915).
# Any scorer failure extracts the page as before. Remove the line to turn it off.
page_relevance_skip_below: 0.1
