# Hermes Agent configuration for PharmaITChat (Hermes 0.21.3, commit 228022ef).
# Installed to ~/.hermes/config.yaml by scripts/hermes-setup.sh install-config.
# Secrets and machine-specific URLs come from ~/.hermes/.env (environment references below and key_env).

model:
  provider: "custom:pharmaitchat"
  default: pharmaitchat-local
  context_length: 65536

providers:
  pharmaitchat:
    # PharmaITChat's OpenAI-compatible gateway: always the active stack's model, whatever name is sent
    api: "${PHARMALLM_URL}/v1"
    key_env: PHARMAITCHAT_API_TOKEN
    discover_models: false
    # Local 27B prefill of a 10-15k token agent prompt takes minutes
    request_timeout_seconds: 1800
    stale_timeout_seconds: 900
    models:
      pharmaitchat-local:
        context_length: 65536

# Cron runs resolve the provider from cron.* first: the per-job creation snapshot stores a bare
# "custom" (Hermes drops the ":pharmaitchat" suffix) and would otherwise fail with "resolved without credentials"
cron:
  model: pharmaitchat-local
  model_provider: "custom:pharmaitchat"

mcp_servers:
  pharmaitchat:
    url: "${PHARMALLM_MCP_URL}"
    headers:
      Authorization: "Bearer ${PHARMALLM_MCP_TOKEN}"
    connect_timeout: 30
    # run_news_agent can take 14 minutes; the service sends keepalives meanwhile
    timeout: 900
    tools:
      # A 16-minute GPU job should not be triggerable from chat or injected content
      exclude:
        - start_reindex
      resources: false
      prompts: false
  # Scheduled runs only. Same endpoint and credentials as `pharmaitchat`; Hermes namespaces MCP tools as
  # mcp__<server>__<tool>, so the two entries coexist and only the tool filter differs.
  pharmaitchat_cron:
    url: "${PHARMALLM_MCP_URL}"
    headers:
      Authorization: "Bearer ${PHARMALLM_MCP_TOKEN}"
    connect_timeout: 30
    timeout: 900
    tools:
      exclude:
        - start_reindex
        - add_knowledge
        # Scheduled jobs must never change who the user is
        - my_role
        # no scheduled job draws images: the GPU belongs to the 27B overnight
        - create_image
      resources: false
      prompts: false

platform_toolsets:
  cli: [web, search, terminal, file, memory, skills, todo, session_search, clarify, cronjob, pharmaitchat]
  telegram: [web, search, terminal, file, memory, skills, todo, session_search, pharmaitchat]
  # Scheduled runs read freshly scraped news with nobody in the loop: no web, no memory, no shell,
  # and a cron-scoped MCP server that cannot write knowledge (MCP calls are never approval-gated)
  cron: [session_search, pharmaitchat_cron]

agent:
  disabled_toolsets: [browser, computer_use, code_execution, image_gen, tts, delegation, kanban, vision]

terminal:
  backend: docker
  # These must fit the Docker VM: colima on this Mac has 1.91 GB / 2 CPUs, shared with Neo4j and SearXNG.
  # container_disk is deliberately unset: Docker on macOS ignores the quota, so setting it would only
  # suggest a limit that is not enforced.
  container_cpu: 1
  container_memory: 512
  container_persistent: true
  docker_mount_cwd_to_workspace: false
  docker_network: false
  docker_volumes: []

approvals:
  mode: smart
  cron_mode: deny
  single_query_mode: deny
  unattended_mode: deny

memory:
  write_approval: false

skills:
  write_approval: true

web:
  search_backend: searxng
  keyless_fallback: false
  keyless_rescue: false

security:
  allow_private_urls: false

unauthorized_dm_behavior: ignore

# Receives the Switch / Cancel buttons PharmaITChat sends for a stack switch (hermes/plugins/pharmaitchat-switch).
# Installed by scripts/hermes-setup.sh install-plugin.
plugins:
  enabled:
    - pharmaitchat-switch
